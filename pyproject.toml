[project]
name = "asl-recognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rishi1234", email = "rishibisht14862@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "mediapipe>=1.2.2",
